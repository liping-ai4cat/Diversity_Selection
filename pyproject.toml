[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divsel"
version = "0.1.0"
description = "Diversity selection of atomic structures (SOAP descriptors, k-means / farthest-point sampling, streaming + seed sets for active learning)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Liping Liu", email = "lipingliu@uchicago.edu" }]
keywords = [
    "atomistic-machine-learning",
    "active-learning",
    "SOAP",
    "descriptors",
    "diversity-selection",
    "farthest-point-sampling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.2",
    "ase>=3.22",
    "dscribe>=2.0",
    "threadpoolctl>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
# Not core dependencies on purpose: fairchem wants python 3.12 / numpy 2.x while
# dscribe here runs on python 3.10 / numpy 1.26, so the two cannot be one hard
# requirement. Both backends are placeholders in 0.1.0 (see divsel/featurizers/).
uma = ["latent-features"]
mace = ["mace-torch"]

[project.scripts]
divsel = "divsel.cli:main"

[project.urls]
Homepage = "https://github.com/liping-ai4cat/Diversity_Selection"

[tool.setuptools.packages.find]
include = ["divsel*"]
